packages:
  - "packages/*"

# First-party packages we publish ourselves: the release-age cooldown adds no supply-chain value here.
minimumReleaseAgeExclude:
  - "*functype*"
  - ts-builds
  - somamcp

# pnpm 12 requires an explicit choice per dependency build script.
allowBuilds:
  esbuild: false # binary ships via @esbuild/<platform> optional deps
  sharp: false # prebuilt binary ships via @img/sharp-<platform> optional deps
  workerd: true # postinstall links the platform binary for the local Workers runtime
