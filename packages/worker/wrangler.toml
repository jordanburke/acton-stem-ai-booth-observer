name = "ai-booth-observer-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[dev]
port = 8787

# KV namespace for rate limiting and cost tracking
# For local dev, KV is optional (will work without it, just won't track budget)
# For production: Run `wrangler kv:namespace create "USAGE_TRACKER"` then add ID below
[[kv_namespaces]]
binding = "USAGE_TRACKER"
id = "preview_id" # Replace with actual ID from: wrangler kv:namespace create "USAGE_TRACKER"
preview_id = "preview_id"

[vars]
# Public configuration (non-sensitive)
MAX_TOKENS_PER_DAY = "1000000"  # 1M tokens ~= $3/day for Haiku
CAPTURE_INTERVAL_SECONDS = "30"

# Note: ANTHROPIC_API_KEY should be set via: wrangler secret put ANTHROPIC_API_KEY
